name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pnt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pnt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pnt_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pnt_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pnt_e2e
      BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-bytes
      BETTER_AUTH_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1lbm91Z2g=
      INNGEST_DEV: "1"
      INNGEST_EVENT_KEY: ci-not-a-real-key
      INNGEST_SIGNING_KEY: signkey-test-ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare logs
        run: mkdir -p .ci-logs
      - name: Apply migrations to isolated PostgreSQL
        run: bun run db:migrate 2>&1 | tee .ci-logs/migrate.log
      - name: Check formatting
        run: bun run format:check 2>&1 | tee .ci-logs/format.log
      - name: Lint
        run: bun run lint 2>&1 | tee .ci-logs/lint.log
      - name: Typecheck
        run: bun run typecheck 2>&1 | tee .ci-logs/typecheck.log
      - name: Run unit tests
        run: bun run test 2>&1 | tee .ci-logs/test.log
      - name: Run isolated PostgreSQL integration invariants
        run: bun run test:integration 2>&1 | tee .ci-logs/integration.log
      - name: Run local browser workflow
        run: bun run test:e2e 2>&1 | tee .ci-logs/e2e.log
      - name: Build
        run: bun run build 2>&1 | tee .ci-logs/build.log
      - name: Audit production dependencies
        run: bun run audit:release 2>&1 | tee .ci-logs/audit.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            .ci-logs
            .tura/e2e/logs
            .tura/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
